name: Atualizar Ranking CNB 2026

on:
  schedule:
    - cron: '0 * * * *' # Executa a cada hora
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install libs
        run: pip install requests pandas openpyxl

      - name: Run Script
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TOKEN_MARCOS: ${{ secrets.TOKEN_MARCOS }}
          # Mapeie novos tokens abaixo conforme adicionar novos atletas:
          # TOKEN_NOVO_ATLETA: ${{ secrets.TOKEN_NOVO_ATLETA }}
        run: python ranking.py

      - name: Save Result
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Robo CNB 2k"
          git config --global user.email "bot@github.com"
          git add Ranking_CNB_2026.xlsx
          git diff --quiet && git diff --staged --quiet || git commit -m "Ranking CNB 2026 atualizado"
          git push origin HEAD:main
